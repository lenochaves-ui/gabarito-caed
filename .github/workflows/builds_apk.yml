name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libffi-dev libssl-dev ccache
          pip3 install buildozer==1.5.0 cython==0.29.36

      - name: Cache SDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('gabarito_app/buildozer.spec') }}

      - name: Compilar APK
        working-directory: gabarito_app
        run: buildozer android debug 2>&1 | tail -100

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: GabaritoCAEd-APK
          path: gabarito_app/bin/*.apk
          retention-days: 30
